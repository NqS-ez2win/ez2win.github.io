<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZ2WIN x100 - PCSO 5:00 PM & 9:00 PM Draw</title>
<!-- Supabase Client CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
--bg-dark: #0f172a;
--card-bg: #1e293b;
--primary: #eab308;
--primary-hover: #ca8a04;
--accent: #22c55e;
--gcash-blue: #007dfe;
--maya-green: #00d632;
--danger: #ef4444;
--text: #f8fafc;
--text-muted: #94a3b8;
--agent-purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background-color: var(--bg-dark); color: var(--text); padding-bottom: 50px; }

/* Header */
header {
background: var(--card-bg);
padding: 12px 24px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid #334155;
position: sticky; top: 0; z-index: 10;
}

.logo-container {
display: flex;
align-items: center;
gap: 12px;
}
.logo {
display: flex;
flex-direction: column;
align-items: flex-end;
line-height: 1;
}
.logo-text {
font-size: 1.6rem;
font-weight: 800;
color: var(--primary);
letter-spacing: 0.5px;
}
.logo-multiplier {
background: linear-gradient(135deg, #22c55e, #15803d);
color: #ffffff;
font-size: 0.7rem;
padding: 2px 7px;
border-radius: 4px;
font-weight: 900;
letter-spacing: 0.5px;
box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
margin-top: 3px;
}
.badge-mode { font-size: 0.75rem; background: #334155; color: #cbd5e1; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
.user-actions { display: flex; align-items: center; gap: 10px; }
.user-profile-badge {
font-size: 0.85rem;
color: var(--primary);
font-weight: 700;
background: #0f172a;
padding: 6px 12px;
border-radius: 8px;
border: 1px solid #334155;
}

/* Winner Ticker */
.winner-ticker-wrapper {
background: linear-gradient(90deg, #1e1b4b, #312e81, #1e1b4b);
border-bottom: 1px solid var(--primary);
overflow: hidden;
white-space: nowrap;
padding: 10px 0;
font-size: 0.92rem;
color: #fef08a;
box-shadow: 0 4px 12px rgba(234, 179, 8, 0.25);
position: relative;
}
.winner-ticker-content {
display: inline-block;
padding-left: 100%;
animation: tickerAnimation 28s linear infinite;
font-weight: 700;
}
.winner-ticker-content:hover {
animation-play-state: paused;
cursor: pointer;
}
.ticker-item {
display: inline-flex;
align-items: center;
margin-right: 40px;
gap: 6px;
}
.ticker-tag {
background: var(--primary);
color: #000;
padding: 2px 6px;
border-radius: 4px;
font-size: 0.75rem;
font-weight: 800;
text-transform: uppercase;
}

@keyframes tickerAnimation {
0% { transform: translate3d(0, 0, 0); }
100% { transform: translate3d(-100%, 0, 0); }
}

.btn {
padding: 8px 16px;
border: none;
border-radius: 8px;
font-weight: 600;
cursor: pointer;
transition: all 0.2s;
}
.btn-sm { padding: 4px 10px; font-size: 0.8rem; }
.btn-primary { background: var(--primary); color: #000; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: #334155; color: var(--text); }
.btn-admin { background: #6366f1; color: #fff; }
.btn-agent { background: var(--agent-purple); color: #fff; }
.btn-gcash { background: var(--gcash-blue); color: #fff; }
.btn-maya { background: var(--maya-green); color: #000; font-weight: 700; }
.btn-success { background: #16a34a; color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }

/* Layout */
.container { max-width: 850px; margin: 24px auto; padding: 0 16px; }

.active-draw-banner {
background: #14532d;
border: 1px solid #22c55e;
color: #86efac;
border-radius: 10px;
padding: 12px 16px;
margin-bottom: 20px;
text-align: center;
font-weight: 600;
font-size: 0.95rem;
}

.draw-banner-grid {
display: flex;
gap: 16px;
margin-bottom: 20px;
flex-wrap: wrap;
}

.draw-banner {
flex: 1;
min-width: 280px;
background: linear-gradient(135deg, #1e1b4b, #312e81);
border: 1px solid #6366f1;
border-radius: 12px;
padding: 18px;
text-align: center;
}
.draw-banner h4 { color: #818cf8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.draw-banner h2 { color: #fff; font-size: 1.15rem; font-weight: 800; margin-bottom: 12px; }
.winning-numbers-display { display: flex; justify-content: center; gap: 12px; align-items: center; }
.win-ball {
width: 48px; height: 48px;
background: radial-gradient(circle at 30% 30%, #fef08a, #eab308);
color: #000; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 1.25rem; font-weight: 800;
box-shadow: 0 4px 12px rgba(234, 179, 8, 0.4);
}
.win-ball.pending { background: #334155; color: #94a3b8; box-shadow: none; font-size: 0.9rem; }

.card {
background: var(--card-bg);
border-radius: 12px;
padding: 24px;
margin-bottom: 20px;
border: 1px solid #334155;
}
.card-title { font-size: 1.2rem; margin-bottom: 14px; color: var(--primary); }

/* EZ2 Grid */
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
.num-btn {
aspect-ratio: 1; border: 1px solid #475569; background: #0f172a;
color: var(--text); border-radius: 8px; font-size: 1.1rem; font-weight: 700;
cursor: pointer; transition: all 0.15s;
}
.num-btn.selected { background: var(--primary); color: #000; border-color: var(--primary-hover); }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <div class="logo">
      <span class="logo-text">EZ2WIN</span>
      <span class="logo-multiplier">x100 PAYOUT</span>
    </div>
  </div>
  <div class="user-actions">
    <span class="user-profile-badge" id="user-display">Guest</span>
  </div>
</header>

<div class="container">
  <div class="card">
    <h3 class="card-title">Place Your Bet (Cloud Storage via Supabase)</h3>
    <p style="color: var(--text-muted); margin-bottom: 15px;">Select your numbers and send them directly to the Supabase database.</p>
    <div class="grid" id="number-grid">
      <!-- Generated via JS -->
    </div>
    <button class="btn btn-primary" id="submit-bet-btn" style="width: 100%;">Submit Bet to Supabase</button>
  </div>
</div>

<script>
  // Initialize Supabase Client (Replace with your actual Supabase URL and Anon Key)
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Generate grid numbers 1 to 31 (EZ2 style)
  const gridContainer = document.getElementById('number-grid');
  let selectedNumbers = [];

  for (let i = 1; i <= 31; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.innerText = i < 10 ? '0' + i : i;
    btn.onclick = () => {
      const val = btn.innerText;
      if (selectedNumbers.includes(val)) {
        selectedNumbers = selectedNumbers.filter(n => n !== val);
        btn.classList.remove('selected');
      } else {
        if (selectedNumbers.length < 2) {
          selectedNumbers.push(val);
          btn.classList.add('selected');
        } else {
          alert('You can only select 2 numbers for EZ2!');
        }
      }
    };
    gridContainer.appendChild(btn);
  }

  // Replace LocalStorage with Supabase Insert
  document.getElementById('submit-bet-btn').onclick = async () => {
    if (selectedNumbers.length !== 2) {
      alert('Please select exactly 2 numbers.');
      return;
    }

    // Insert into Supabase 'bets' table (Cloud Storage)
    const { data, error } = await supabase
      .from('bets')
      .insert([{ numbers: selectedNumbers }]);

    if (error) {
      console.error('Supabase Error:', error.message);
      alert('Failed to save bet to Supabase cloud: ' + error.message);
    } else {
      alert('Bet successfully stored in Supabase cloud database!');
      // Reset selection
      selectedNumbers = [];
      document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
    }
  };
</script>

</body>
</html>
