<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZ2WIN x100 - PCSO 5:00 PM & 9:00 PM Draw</title>
<!-- Supabase Client CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
--bg-dark: #0f172a;
--card-bg: #1e293b;
--primary: #eab308;
--primary-hover: #ca8a04;
--accent: #22c55e;
--text: #f8fafc;
--text-muted: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background-color: var(--bg-dark); color: var(--text); padding-bottom: 50px; }

header {
background: var(--card-bg);
padding: 12px 24px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid #334155;
position: sticky; top: 0; z-index: 10;
}

.logo-text { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
.logo-multiplier {
background: linear-gradient(135deg, #22c55e, #15803d);
color: #fff; font-size: 0.7rem; padding: 2px 7px; border-radius: 4px; font-weight: 900;
}
.user-profile-badge { font-size: 0.85rem; color: var(--primary); font-weight: 700; background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; }

.btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--primary); color: #000; width: 100%; font-size: 1rem; }
.btn-primary:hover { background: var(--primary-hover); }

.container { max-width: 600px; margin: 24px auto; padding: 0 16px; }

.card {
background: var(--card-bg);
border-radius: 12px;
padding: 24px;
margin-bottom: 20px;
border: 1px solid #334155;
box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}
.card-title { font-size: 1.2rem; margin-bottom: 8px; color: var(--primary); }

.grid { 
  display: grid; 
  grid-template-columns: repeat(6, 1fr); 
  gap: 10px; 
  margin: 20px 0; 
}
.num-btn {
  aspect-ratio: 1; 
  border: 1px solid #475569; 
  background: #0f172a;
  color: var(--text); 
  border-radius: 8px; 
  font-size: 1.1rem; 
  font-weight: 700;
  cursor: pointer; 
  transition: all 0.15s;
}
.num-btn:hover { border-color: var(--primary); }
.num-btn.selected { background: var(--primary); color: #000; border-color: var(--primary-hover); }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <div class="logo" style="display:flex; flex-direction:column; align-items:flex-end;">
      <span class="logo-text">EZ2WIN</span>
      <span class="logo-multiplier">x100 PAYOUT</span>
    </div>
  </div>
  <div class="user-actions">
    <span class="user-profile-badge" id="user-display">Guest</span>
  </div>
</header>

<div class="container">
  <div class="card">
    <h3 class="card-title">Place Your Bet (Cloud Storage via Supabase)</h3>
    <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem;">Select your 2 numbers and send them directly to the Supabase cloud database.</p>
    
    <div class="grid" id="number-grid">
      <!-- Generated via JS -->
    </div>

    <button class="btn btn-primary" id="submit-bet-btn" type="button">Submit Bet to Supabase</button>
  </div>
</div>

<script>
  // 1. Initialize Supabase safely
  let supabase = null;
  try {
    const SUPABASE_URL = 'https://iiwmghlxxsnxpkgljlml.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VmBHMGt3DPBxgJcq87FLUA_0geoq9-r';
    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (err) {
    console.error('Supabase Setup Error:', err);
  }

  // 2. Generate grid numbers 1 to 31 (Runs independently so buttons ALWAYS appear)
  const gridContainer = document.getElementById('number-grid');
  let selectedNumbers = [];

  for (let i = 1; i <= 31; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.type = 'button';
    btn.innerText = i < 10 ? '0' + i : i;
    btn.onclick = () => {
      const val = btn.innerText;
      if (selectedNumbers.includes(val)) {
        selectedNumbers = selectedNumbers.filter(n => n !== val);
        btn.classList.remove('selected');
      } else {
        if (selectedNumbers.length < 2) {
          selectedNumbers.push(val);
          btn.classList.add('selected');
        } else {
          alert('You can only select 2 numbers for EZ2!');
        }
      }
    };
    gridContainer.appendChild(btn);
  }

  // 3. Handle Supabase Cloud Insert on Button Click
  document.getElementById('submit-bet-btn').onclick = async () => {
    if (selectedNumbers.length !== 2) {
      alert('Please select exactly 2 numbers.');
      return;
    }

    if (!supabase) {
      alert('Supabase client failed to initialize.');
      return;
    }

    const { data, error } = await supabase
      .from('bets')
      .insert([{ numbers: selectedNumbers }]);

    if (error) {
      console.error('Supabase Error:', error.message);
      alert('Failed to save bet to Supabase cloud: ' + error.message);
    } else {
      alert('Bet successfully stored in Supabase cloud database!');
      selectedNumbers = [];
      document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
    }
  };
</script>

</body>
</html>
