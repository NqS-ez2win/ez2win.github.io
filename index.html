<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ2WIN x100 - PCSO Draw Platform</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card-bg); padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; color: var(--primary); }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; width: 100%; max-width: 450px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    h2 { margin-bottom: 1.5rem; font-size: 1.25rem; text-align: center; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    input { width: 100%; padding: 0.75rem; background: var(--bg-color); border: 1px solid var(--border); border-radius: 6px; color: var(--text-color); font-size: 1rem; }
    input:focus { outline: none; border-color: var(--primary); }
    button { width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
    button:hover { background: var(--primary-hover); }
    .hidden { display: none !important; }
    .dashboard-container { width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1fr 300px; gap: 2rem; }
    @media(max-width: 768px) { .dashboard-container { grid-template-columns: 1fr; } }
    .dashboard-main { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
    .dashboard-sidebar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
    .user-info { margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-muted); }
    .logout-btn { background: #ef4444; margin-top: auto; }
    .logout-btn:hover { background: #dc2626; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 1.5rem 0; }
    .number-btn { aspect-ratio: 1; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-color); border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .number-btn.selected { background: var(--primary); border-color: var(--primary); }
    .ticker { background: var(--border); padding: 0.5rem 1rem; font-size: 0.875rem; white-space: nowrap; overflow: hidden; position: relative; }
    .auth-toggle { text-align: center; margin-top: 1rem; font-size: 0.875rem; color: var(--text-muted); }
    .auth-toggle a { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }
    .auth-toggle a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="ticker">
    <span>📢 Welcome to EZ2WIN x100! PCSO 5:00 PM and 9:00 PM draws active. Multiplier: 100x Payout.</span>
  </div>

  <header>
    <h1>EZ2WIN x100</h1>
    <div id="header-user" class="hidden">
      <span id="user-email-display" style="margin-right: 1rem; font-size: 0.9rem;"></span>
      <button id="header-logout" style="width: auto; padding: 0.4rem 1rem; margin-top: 0;">Logout</button>
    </div>
  </header>

  <main>
    <!-- Authentication Screen (Login / Register) -->
    <div id="login-card" class="card">
      <h2 id="auth-form-title">Client Login</h2>
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label for="login-password">Password (min. 6 characters)</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button id="auth-btn">Sign In</button>
      <div class="auth-toggle">
        <span id="toggle-prompt">Don't have an account?</span> 
        <a id="toggle-auth-mode">Register</a>
      </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="dashboard-container hidden">
      <div class="dashboard-main">
        <h2>EZ2 Bet Terminal</h2>
        <p class="user-info">Select two numbers (1-31) for the upcoming PCSO draw.</p>
        <div class="grid" id="number-grid"></div>
        <div style="margin-top: 1.5rem;">
          <label>Stake Amount (₱)</label>
          <input type="number" id="stake-amount" value="20" min="10" max="50">
        </div>
        <button id="place-bet-btn" style="margin-top: 1.5rem;">Place Bet (100x Payout)</button>
      </div>
      <div class="dashboard-sidebar">
        <div>
          <h3>Account Panel</h3>
          <p id="sidebar-email" class="user-info" style="margin-top: 0.5rem;"></p>
        </div>
        <button id="sidebar-logout" class="logout-btn">Sign Out</button>
      </div>
    </div>
  </main>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://iiwmghlxxsnxpkgljlml.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_VmBHMGt3DPBxgJcq87FLUA_0geoq9-r";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    // DOM Elements
    const loginCard = document.getElementById('login-card');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const loginEmailInput = document.getElementById('login-email');
    const loginPasswordInput = document.getElementById('login-password');
    const authBtn = document.getElementById('auth-btn');
    const authFormTitle = document.getElementById('auth-form-title');
    const togglePrompt = document.getElementById('toggle-prompt');
    const toggleAuthMode = document.getElementById('toggle-auth-mode');
    const headerUser = document.getElementById('header-user');
    const userEmailDisplay = document.getElementById('user-email-display');
    const sidebarEmail = document.getElementById('sidebar-email');
    const headerLogout = document.getElementById('header-logout');
    const sidebarLogout = document.getElementById('sidebar-logout');
    const numberGrid = document.getElementById('number-grid');

    // State
    let isRegisterMode = false;
    let selectedNumbers = [];

    // Initialize Application & Session Persistence Check on Page Load
    document.addEventListener("DOMContentLoaded", async () => {
      buildNumberGrid();

      try {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error) console.error("Session check error:", error);

        if (session) {
          handleUserAuthenticated(session.user);
        } else {
          handleUserLoggedOut();
        }
      } catch (err) {
        console.error("Initialization exception:", err);
      }

      supabase.auth.onAuthStateChange((event, currentSession) => {
        if (event === 'SIGNED_IN' && currentSession) {
          handleUserAuthenticated(currentSession.user);
        } else if (event === 'SIGNED_OUT') {
          handleUserLoggedOut();
        }
      });
    });

    // Toggle between Sign In and Register Mode
    toggleAuthMode.addEventListener('click', (e) => {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      if (isRegisterMode) {
        authFormTitle.textContent = 'Create Account';
        authBtn.textContent = 'Register';
        togglePrompt.textContent = 'Already have an account?';
        toggleAuthMode.textContent = 'Sign In';
      } else {
        authFormTitle.textContent = 'Client Login';
        authBtn.textContent = 'Sign In';
        togglePrompt.textContent = "Don't have an account?";
        toggleAuthMode.textContent = 'Register';
      }
    });

    // Authentication Handler (Handles both Sign In and Sign Up)
    authBtn.addEventListener('click', async () => {
      const email = loginEmailInput.value.trim();
      const password = loginPasswordInput.value.trim();

      if (!email || !password) {
        alert('Please fill in both email and password.');
        return;
      }

      if (isRegisterMode && password.length < 6) {
        alert('Password must be at least 6 characters long.');
        return;
      }

      try {
        if (isRegisterMode) {
          authBtn.textContent = 'Registering...';
          const { data, error } = await supabase.auth.signUp({ email, password });
          authBtn.textContent = 'Register';

          if (error) {
            alert('Registration failed: ' + error.message);
            console.error("Supabase SignUp Error:", error);
          } else {
            if (data.session) {
              handleUserAuthenticated(data.user);
            } else {
              alert('Registration successful! Please check your email inbox to confirm your account before logging in.');
              isRegisterMode = false;
              authFormTitle.textContent = 'Client Login';
              authBtn.textContent = 'Sign In';
              togglePrompt.textContent = "Don't have an account?";
              toggleAuthMode.textContent = 'Register';
              loginPasswordInput.value = '';
            }
          }
        } else {
          authBtn.textContent = 'Signing in...';
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          authBtn.textContent = 'Sign In';

          if (error) {
            alert('Login failed: ' + error.message);
            console.error("Supabase SignIn Error:", error);
          } else {
            handleUserAuthenticated(data.user);
          }
        }
      } catch (err) {
        authBtn.textContent = isRegisterMode ? 'Register' : 'Sign In';
        alert('An unexpected error occurred. Check browser console for details.');
        console.error("Auth Exception:", err);
      }
    });

    // Logout Handlers
    const handleLogout = async () => {
      await supabase.auth.signOut();
    };

    headerLogout.addEventListener('click', handleLogout);
    sidebarLogout.addEventListener('click', handleLogout);

    // View Switchers
    function handleUserAuthenticated(user) {
      loginCard.classList.add('hidden');
      dashboardScreen.classList.remove('hidden');
      headerUser.classList.remove('hidden');
      userEmailDisplay.textContent = user.email;
      sidebarEmail.textContent = `Logged in as: ${user.email}`;
    }

    function handleUserLoggedOut() {
      dashboardScreen.classList.add('hidden');
      headerUser.classList.add('hidden');
      loginCard.classList.remove('hidden');
      loginEmailInput.value = '';
      loginPasswordInput.value = '';
    }

    // Build Betting Grid (1 to 31)
    function buildNumberGrid() {
      numberGrid.innerHTML = '';
      for (let i = 1; i <= 31; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'number-btn';
        btn.textContent = i < 10 ? '0' + i : i;
        btn.addEventListener('click', () => toggleNumberSelection(i, btn));
        numberGrid.appendChild(btn);
      }
    }

    function toggleNumberSelection(num, btnElement) {
      const index = selectedNumbers.indexOf(num);
      if (index > -1) {
        selectedNumbers.splice(index, 1);
        btnElement.classList.remove('selected');
      } else {
        if (selectedNumbers.length >= 2) {
          alert('You can only select exactly 2 numbers for EZ2!');
          return;
        }
        selectedNumbers.push(num);
        btnElement.classList.add('selected');
      }
    }
  </script>
</body>
</html>
