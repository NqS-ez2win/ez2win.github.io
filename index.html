<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZ2WIN Test</title>
<style>
body { background-color: #0f172a; color: #fff; font-family: sans-serif; padding: 40px; text-align: center; }
.card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 500px; margin: 0 auto; border: 1px solid #334155; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 20px 0; }
.num-btn { aspect-ratio: 1; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 8px; font-size: 1.2rem; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
  <h2>Diagnostic Test</h2>
  <p>If you see button '01' below, the file updated. If it's blank, GitHub/DNS is caching the old file.</p>
  
  <div class="grid" id="number-grid">
    <!-- Hardcoded test button -->
    <button class="num-btn">01</button>
  </div>
</div>

</body>
</html>
